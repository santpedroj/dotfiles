disableStartupPopups: true
gui:
  showPanelJumps: false
  sidePanels:
    - [status]
    - [files, worktrees]
    - [branches, tags]
    - [commits]
  showRandomTip: false
  showCommandLog: false
  showRootItemInFileTree: true
  showNumstatInFilesView: true
  showBottomLine: false
  commitHashLength: 0
keybinding:
  universal:
    focusMainView: "0"
    jumpToBlock:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
