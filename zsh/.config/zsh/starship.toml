# Schema
"$schema" = "https://starship.rs/config-schema.json"

# Prompt Format
format = """
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$c\
$rust\
$nodejs\
$python\
$lua\
$ruby\
$package\
$docker_context\
$jobs\
$cmd_duration\
$container\
$line_break\
$character"""

add_newline = true

# Fill
[fill]
symbol = " "

# Line Break
[line_break]
disabled = false

# Operating System
[os]
disabled = false
style = "bold blue"
format = "[$symbol]($style) "

[os.symbols]
Alpine = " "
Arch = " "
CentOS = " "
Debian = " "
Fedora = " "
Kali = " "

# Hostname
[hostname]
ssh_only = true
ssh_symbol = " "
format = "[$ssh_symbol](bold gray) at [$hostname](bold green) "
disabled = false

# Directory
[directory]
read_only = "󰌾"
read_only_style = "purple"
format = "[$path ]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = " "
"Music" = " "
"Pictures" = " "

# Git
[git_branch]
symbol = " "

[git_commit]
tag_symbol = "  "

# Programming Languages
[c]
symbol = " "

[rust]
style = "orange"
symbol = " "

[nodejs]
symbol = " "

[python]
style = "yellow"
symbol = " "
format = '[${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)'
pyenv_version_name = true
pyenv_prefix = ""

[lua]
symbol = " "

[ruby]
symbol = " "

# Package
[package]
symbol = "󰏗 "

# Docker
[docker_context]
symbol = " "
style = "fg:#06969A"
format = "[$symbol]($style) $path"
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]
detect_extensions = ["Dockerfile"]

# Jobs
[jobs]
symbol = " "
style = "red"
number_threshold = 1
format = "[$symbol]($style)"

# Command Duration
[cmd_duration]
min_time = 500
style = "fg:yellow"
format = "[$duration]($style)"

# Container
[container]
symbol = " "
style = "bold red dimmed"
format = "[$symbol \\[$name\\]]($style) "

# Prompt Character
#[character]
#error_symbol = "[✗](bold red) "

# Custom Modules
[custom.update]
when = "/usr/bin/rpm-ostree status --json | /usr/bin/jq -e \".deployments[0].booted == false\" > /dev/null;"
command = "echo \"New deployment staged\""
symbol = ""
format = " $symbol [($output)]($style) "
style = "italic green"
