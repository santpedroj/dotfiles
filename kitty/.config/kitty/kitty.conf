# vim:fileencoding=utf-8:foldmethod=marker

# general
confirm_os_window_close 0

#: Fonts

# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-Regular
bold_font        family='JetBrainsMono Nerd Font' style=SemiBold
italic_font      auto
bold_italic_font family='JetBrainsMono Nerd Font' style='SemiBold Italic'
# END_KITTY_FONTS

font_size 19.0

#: Cursor
disable_ligatures cursor
cursor_shape block
cursor_shape_unfocused hollow
cursor_beam_thickness 1.5
cursor_underline_thickness 2.0
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.05 0.2
cursor_trail_start_threshold 2

#: Performance tuning
repaint_delay 2
input_delay 0
sync_to_monitor no

#: Audio bell
enable_audio_bell false

#: Decoration
hide_window_decorations yes
tab_bar_edge top
tab_bar_margin_height 0.0 0.0
tab_bar_style powerline
tab_powerline_style angled
background_opacity 1

#: Advanced
shell zsh
editor nvim
shell_integration enabled
wayland_enable_ime no

#: Keybinds
kitty_mod ctrl+shift

map kitty_mod+f11 toggle_fullscreen
map kitty_mod+f10 toggle_maximized
map kitty_mod+, load_config_file
map shift+up move_window up
map shift+down move_window down
map shift+left move_window left
map shift+right move_window right

# BEGIN_KITTY_THEME
# Kanagawa
include current-theme.conf
# END_KITTY_THEME
