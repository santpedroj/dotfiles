# Use zsh as default shell
set -g default-shell /usr/bin/zsh

set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB'

# General
set -g set-clipboard on
set -g history-limit 50000
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0 # remove delay for exiting insert mode
set -g status-interval 3 # update status bar every 3 seconds
set -g display-time 4000 # increase message display-time
set -g allow-passthrough on # allow programs in the pane to bypass tmux
set -g mode-keys vi

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Keybinds
bind r source-file /var/home/pedro/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Theme
set -g @theme "kanagawa"

if-shell -F '#{==:#{@theme},kanagawa}' {
    source-file /var/home/pedro/.config/tmux/kanagawa-theme.conf
}

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'
