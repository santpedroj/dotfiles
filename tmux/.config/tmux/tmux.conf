# Use zsh as default shell
set -g default-shell /usr/bin/zsh

set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB'

# General
set -g set-clipboard on
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0 # remove delay for exiting insert mode
set -g status-interval 3 # update status bar every 3 seconds
set -g allow-passthrough on # allow programs in the pane to bypass tmux
set -g mode-keys vi

# Windows and panes
set -g base-index 1              # start indexing windows and panes  at 1 instead of 0
set -g renumber-windows on       # renumber all windows when any window is closed

# Keybinds
bind r source-file /var/home/pedro/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Style
white="#C8C093"
green="#98BB6C"
blue="#7FB4CA"

set -g status-position top
set -g status-left-length 100
set -g status-style "fg=${white},bg=default"
set -g status-left "#[fg=${green},bold] #S #[fg=${white},nobold]| "
set -g status-right " #{cpu}  #{mem} "
set -g window-status-current-format "#[fg=${blue},bold]  #[underscore]#I:#W"
set -g window-status-format " #I:#W"
set -g message-style "fg=${white},bg=black,fill=black,align=left"
set -g message-command-style "fg=${white},bg=black,fill=black"
