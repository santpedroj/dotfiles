# Style
white="#C8C093"
green="#98BB6C"
blue="#7FB4CA"

set -g status-position top
set -g status-left-length 200  # default: 10
set -g status-right-length 200 # default: 10
set -g status-style "fg=${white},bg=default"
set -g status-left "#[fg=${green},bold] #S #[fg=${white},nobold]| "
set -g status-right "#[fg=${white},bg=${default}] 󰃮 %Y-%m-%d 󱑒 %H:%M"
set -g window-status-current-format "#[fg=${blue},bold]  #[underscore]#I:#W"
set -g window-status-format " #I:#W"
set -g message-style "fg=${white},bg=black,fill=black"
set -g message-command-style "fg=${white},bg=black,fill=black"
