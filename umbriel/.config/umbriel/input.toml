# ==============================================================================
# Input
# ==============================================================================

# Enable NumLock when a physical keyboard connects.
# https://docs.noctalia.dev/umbriel/input/

[input.keyboard]
layout = "us,br"           # empty uses the system default
variant = "altgr-intl"
options = "compose:ralt"
repeat_rate = 40
repeat_delay = 200
numlock_toggle = true
track_layout = "global"

# ==============================================================================
# Mouse
# ==============================================================================

[input.cursor]
theme = "Adwaita"
size = 24
hardware_cursor = true
follows_focus = false
hide_when_typing = true
hide_timeout_ms = 0

[input.mouse]
natural_scroll = false
left_handed = false
accel_profile = "flat"
sensitivity = 0.0
scroll_wheel_step = 60
# scroll_button = "MouseBack"
# scroll_button_lock = false

# ==============================================================================
# Touchpad
# ==============================================================================

[input.touchpad]
tap = true
natural_scroll = true
left_handed = false
accel_profile = "flat"
# sensitivity = 0.5
# scroll_factor = 1.5
disable_while_typing = true
# disable_on_external_mouse = true
# click_method = "clickfinger"
# tap_button_map = "left_middle_right"

# ==============================================================================
# Focus
# ==============================================================================

# Focus can follow the pointer across tiled, floating, and pinned windows.
# [input.focus]
# follows_mouse = true

