# ==============================================================================
# Input
# ==============================================================================

# Enable NumLock when a physical keyboard connects.
# https://docs.noctalia.dev/umbriel/input/

[input.keyboard]
layout = "us,br"           # empty uses the system default
variant = "altgr-intl"
options = "compose:ralt"
repeat_rate = 40
repeat_delay = 200
numlock_toggle = true
track_layout = "global"

# ==============================================================================
# Mouse
# ==============================================================================

[input.mouse]
natural_scroll = false
left_handed = false
accel_profile = "flat"
sensitivity = 0.0
scroll_wheel_step = 60
# scroll_button = "MouseBack"
# scroll_button_lock = false

# ==============================================================================
# Focus
# ==============================================================================

# Focus can follow the pointer across tiled, floating, and pinned windows.
# [input.focus]
# follows_mouse = true

# ==============================================================================
# Touch
# ==============================================================================

# Confine touch input to one display.
# [input.touch]
# enabled = true
# map_to_output = "eDP-1"

