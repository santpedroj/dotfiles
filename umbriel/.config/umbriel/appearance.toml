# ==============================================================================
# Appearance
# ==============================================================================

# Blur uses a smaller radius than the built-in default.
# https://docs.noctalia.dev/umbriel/appearance/

[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 0
corner_radius = 0
drag_opacity = 0.75
opaque_fullscreen = true

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 5
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

# Choose the background color shown if the lock screen takes too long to appear.
# [colors]
# backdrop = "#000000FF"

# ==============================================================================
# Animations
# ==============================================================================

[animation]
enabled = true
duration_ms = 150
curve = "easeout"

# ------------------------------------------------------------------------------
# Windows in
# ------------------------------------------------------------------------------

[animation.windows_in]
enabled = true
curve = "spring:1,900"
style = "popin"
scale = 0.8

# ------------------------------------------------------------------------------
# Windows out
# ------------------------------------------------------------------------------

[animation.windows_out]
enabled = true
curve = "spring:1,1400"
style = "popin"
scale = 0.8

# ------------------------------------------------------------------------------
# Windows move
# ------------------------------------------------------------------------------

[animation.windows_move]
enabled = true
curve = "spring:1,900"

# ------------------------------------------------------------------------------
# Workspaces
# ------------------------------------------------------------------------------

[animation.workspaces]
enabled = false
curve = "snappy"

# ------------------------------------------------------------------------------
# Overview
# ------------------------------------------------------------------------------

[animation.overview]
enabled = true
curve = "easeout"
workspace_curve = "snappy"

# ------------------------------------------------------------------------------
# Scratchpad
# ------------------------------------------------------------------------------

[animation.scratchpad]
enabled = true
curve = "spring:1,800"
dim = 0.8
blur = false

# ------------------------------------------------------------------------------
# Border
# ------------------------------------------------------------------------------

[animation.border]
enabled = true
curve = "snappy"
#curve = "spring:1,900"

# ------------------------------------------------------------------------------
# Dim unfocused
# ------------------------------------------------------------------------------

[animation.dim_unfocused]
enabled = false
dim = 0.0

# ------------------------------------------------------------------------------
# Layers
# ------------------------------------------------------------------------------

[animation.layers]
enabled = false

# ==============================================================================
# Effects
# ==============================================================================

# Every effect is off until a preset is selected. Include a bundled preset
# (adjust /usr for the package prefix), then select it by name.
# https://docs.noctalia.dev/umbriel/effects/
# [include]
# files = ["/usr/share/umbriel/effects/border/pulse/effect.toml"]
# [effects]
# border = "pulse"
