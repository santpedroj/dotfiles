# ==============================================================================
# Appearance
# ==============================================================================

# Blur uses a smaller radius than the built-in default.
# https://docs.noctalia.dev/umbriel/appearance/

[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 0
corner_radius = 0
drag_opacity = 0.75
opaque_fullscreen = true

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 5
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

# Choose the background color shown if the lock screen takes too long to appear.
# [colors]
# backdrop = "#000000FF"

# ==============================================================================
# Animations
# ==============================================================================

[animation.beziers]
easeOutQuint = [0.23, 1.0, 0.32, 1.0]
easeInOutCubic = [0.65, 0.05, 0.36, 1.0]
linear = [0.0, 0.0, 1.0, 1.0]
almostLinear = [0.5, 0.5, 0.75, 1.0]
quick = [0.15, 0.0, 0.1, 1.0]

[animation]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.windows_in]
enabled = true
duration_ms = 328
curve = "easeOutQuint"
style = "popin"
scale = 0.87

[animation.windows_out]
enabled = true
duration_ms = 119
curve = "linear"
style = "popin"
scale = 0.87

[animation.windows_move]
enabled = true
duration_ms = 303
curve = "easeOutQuint"

[animation.windows_resize]
enabled = true
duration_ms = 303
curve = "easeOutQuint"

[animation.workspaces]
enabled = false

[animation.overview]
enabled = true
duration_ms = 303
curve = "easeOutQuint"
workspace_curve = "easeOutQuint"

[animation.scratchpad]
enabled = true
curve = "linear"
dim = 0.8
blur = false

[animation.border]
enabled = true
duration_ms = 431
curve = "easeOutQuint"

[animation.dim_unfocused]
enabled = false
dim = 0.0

[animation.layers]
enabled = true
duration_ms = 305
curve = "easeOutQuint"

# ==============================================================================
# Effects
# ==============================================================================

# Every effect is off until a preset is selected. Include a bundled preset
# (adjust /usr for the package prefix), then select it by name.
# https://docs.noctalia.dev/umbriel/effects/
# [include]
# files = ["/usr/share/umbriel/effects/border/pulse/effect.toml"]
# [effects]
# border = "pulse"
