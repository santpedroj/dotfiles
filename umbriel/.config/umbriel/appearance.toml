# ==============================================================================
# Appearance
# ==============================================================================

# Blur uses a smaller radius than the built-in default.
# https://docs.noctalia.dev/umbriel/appearance/

[appearance]
prefer_no_csd = true
border_width = 3
outer_border_width = 0
corner_radius = 10
drag_opacity = 0.75
opaque_fullscreen = true

[overview]
zoom = 0.5
scroll_factor_horizontal = 1.0
scroll_factor_vertical = 1.0
background_blur = false
workspace_wallpaper = true
shortcuts = true
shortcut_keys = "1234567890"

[appearance.blur]
radius = 3

# Choose the background color shown if the lock screen takes too long to appear.
# [colors]
# backdrop = "#000000FF"

# ==============================================================================
# Animations
# ==============================================================================

[animation]
enabled = true
duration_ms = 150
curve = "easeout"

# ------------------------------------------------------------------------------
# Windows in
# ------------------------------------------------------------------------------

[animation.windows_in]
enabled = true
curve = "spring:1,900"
style = "popin"
scale = 0.5

# ------------------------------------------------------------------------------
# Windows out
# ------------------------------------------------------------------------------

[animation.windows_out]
enabled = true
curve = "spring:1,1400"
style = "popin"
scale = 0.8

# ------------------------------------------------------------------------------
# Windows move
# ------------------------------------------------------------------------------

[animation.windows_move]
enabled = true
curve = "spring:1,900"

# ------------------------------------------------------------------------------
# Workspaces
# ------------------------------------------------------------------------------

[animation.workspaces]
enabled = false
curve = "spring:1,800"

# ------------------------------------------------------------------------------
# Overview
# ------------------------------------------------------------------------------

[animation.overview]
enabled = true
curve = "spring:1,800"
workspace_curve = "spring:1,1000"

# ------------------------------------------------------------------------------
# Scratchpad
# ------------------------------------------------------------------------------

[animation.scratchpad]
enabled = true
curve = "spring:1,800"
dim = 0.8
blur = false
scale = 0.0
maximize = false
fullscreen = false

# ------------------------------------------------------------------------------
# Border
# ------------------------------------------------------------------------------

[animation.border]
enabled = true
curve = "spring:1,900"

# ------------------------------------------------------------------------------
# Dim unfocused
# ------------------------------------------------------------------------------

[animation.dim_unfocused]
enabled = false
dim = 0.0

# ------------------------------------------------------------------------------
# Layers
# ------------------------------------------------------------------------------

[animation.layers]
enabled = false

# ==============================================================================
# Effects
# ==============================================================================

# Every effect is off until a preset is selected. Include a bundled preset
# (adjust /usr for the package prefix), then select it by name.
# https://docs.noctalia.dev/umbriel/effects/
# [include]
# files = ["/usr/share/umbriel/effects/border/pulse/effect.toml"]
# [effects]
# border = "pulse"
