# ==============================================================================
# Window rules
# ==============================================================================

# Rules combine in order, with later values overriding earlier ones.
# https://docs.noctalia.dev/umbriel/window-rules/

# ==============================================================================
# Blur
# ==============================================================================

[[window_rule]]
blur = false
blur_optimized = false

# ==============================================================================
# Apps
# ==============================================================================

# Terminal
[[window_rule]]
match.app_id = "kitty"
match.is_alone = true
default_maximize = true

# Browser
[[window_rule]]
match.app_id = "brave-origin"
match.is_alone = true
default_maximize = true

# File_manager
[[window_rule]]
match.app_id = "^dolphin$"
match.is_alone = true
default_maximize = true

[[window_rule]]
match.app_id = "^dolphin$"
match.title = "^Rename "
default_floating = true

[[window_rule]]
match.app_id = "^dfr[.]floating[.]dolphin$"
default_floating = true
default_floating_size = { width = 0.33, height = 0.5 }

# ==============================================================================
# Noctalia
# ==============================================================================

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size = { width = 0.7, height = 0.9 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size = { width = 0.7, height = 0.9 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "top_left" }
default_focused = false
default_pinned = true

# Leave an application that draws its own corners and shadow undecorated.
