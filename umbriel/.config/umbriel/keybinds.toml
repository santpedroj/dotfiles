# ==============================================================================
# Keybinds
# Defining this table replaces the built-in bind set, so every active bind that
# should remain available is listed here.
# Syntax: https://docs.noctalia.dev/umbriel/keybinds/
# Actions: https://docs.noctalia.dev/umbriel/actions/
[keybinds]

# Applications and session
"Mod+Return" = { action = "spawn:ghostty", repeat = false }
"Mod+B" = { action = "spawn:brave-origin", repeat = false }
"Mod+E" = { action = "spawn:thunar", repeat = false }
"Mod+Shift+E" = { action = "spawn:thunar --name=dfr.floating.thunar", repeat = false }
"Mod+Space" = "spawn:noctalia msg panel-toggle launcher"
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Escape" = "session-quit"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# Noctalia panels
"Alt+Tab" = { action = "spawn:noctalia msg window-switcher", repeat = false }
"Mod+A" = { action = "spawn:noctalia msg panel-toggle control-center notifications", repeat = false }
"Mod+X" = { action = "spawn:noctalia msg panel-toggle control-center", repeat = false }
"Mod+Z" = { action = "spawn:noctalia msg settings-toggle", repeat = false }
"Mod+V" = { action = "spawn:noctalia msg panel-toggle clipboard", repeat = false }
"Mod+Shift+W" = { action = "spawn:noctalia msg panel-toggle wallpaper", repeat = false }
"Mod+Alt+C" = { action = "spawn:noctalia msg panel-toggle session", repeat = false }
"Ctrl+Shift+S" = { action = "spawn:noctalia msg screenshot-region", repeat = false } # was SUPER+R in Hyprland

# Nightlight
"Mod+N" = { action = "spawn:noctalia msg nightlight-enable", repeat = false }
"Mod+Alt+N" = { action = "spawn:noctalia msg nightlight-disable", repeat = false }

# Media and brightness (Noctalia)
"XF86AudioRaiseVolume" = "spawn:noctalia msg volume-up"
"XF86AudioLowerVolume" = "spawn:noctalia msg volume-down"
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", repeat = false }
"XF86MonBrightnessUp" = "spawn:noctalia msg brightness-up"
"XF86MonBrightnessDown" = "spawn:noctalia msg brightness-down"

# Focus and movement
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+F1" = "window-focus-next"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+L" = "column-move-right"
"Mod+Shift+K" = "window-move-up"
"Mod+Shift+J" = "window-move-down"

# Window state and layout
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+M" = { action = "window-toggle-maximize", repeat = false }
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Comma" = "window-consume-left"
"Mod+Period" = "window-consume-right"
"Mod+Shift+Comma" = "layout-scroll-left"
"Mod+Shift+Period" = "layout-scroll-right"
"Mod+I" = "window-consume-or-expel-left"
"Mod+Shift+O" = "window-consume-or-expel-right"
"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
"Mod+O" = { action = "overview-toggle", repeat = false }

# Resize (repeats while held)
"Mod+Ctrl+H" = "window-modify-primary-extent:-0.05"
"Mod+Ctrl+L" = "window-modify-primary-extent:0.05"
"Mod+Ctrl+J" = "window-modify-height-down:-0.05"
"Mod+Ctrl+K" = "window-modify-height-down:0.05"

# Workspaces
"Ctrl+Alt+L" = "workspace-next"
"Ctrl+Alt+H" = "workspace-previous"
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"

# Scratchpad
#"Mod+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }
#"Mod+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = { action = "window-restore-from-scratchpad", repeat = false }
"Mod+Tab" = "scratchpad-focus-next"
